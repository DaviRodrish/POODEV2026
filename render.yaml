services:
  - type: web
    name: poodev-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DOC_ENCRYPTION_KEY
        sync: false
      - key: DOC_LOOKUP_KEY
        sync: false
